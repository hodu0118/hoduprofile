<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="Avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF6E4;
    --stripe: #FFE7B0;
    --card-top: #FFD466;
    --card-bottom: #F2A93C;
    --ink: #4A331B;
    --scarf-red: #E24B4B;
    --scarf-green: #4E9B4B;
    --glow: rgba(255, 196, 90, 0.55);
    --card-radius: 28px;
    --danger: #C74A3B;
    --ok: #3F8A4C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  body {
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 32px 16px;
    background: var(--cream);
    background-image: repeating-linear-gradient(115deg, var(--stripe) 0px, var(--stripe) 26px, var(--cream) 26px, var(--cream) 64px);
  }
  .card {
    width: 100%; max-width: 380px;
    border-radius: var(--card-radius);
    padding: 34px 26px 28px;
    background: linear-gradient(160deg, var(--card-top) 0%, var(--card-bottom) 100%);
    box-shadow: 0 18px 40px -14px rgba(120, 74, 20, 0.45), 0 2px 0 rgba(255,255,255,0.35) inset;
    animation: rise 0.5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .shake { animation: shake 0.5s; }

  h1.title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800; font-size: 24px; color: #fff;
    text-shadow: 0 2px 0 rgba(120,70,10,0.35);
    margin: 0 0 20px; text-align: center;
  }

  .field-label {
    display:block; font-weight: 700; font-size: 13px;
    color: rgba(74,51,27,0.85); margin-bottom: 6px;
  }

  input[type="password"], input[type="number"], input[type="text"] {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: none;
    font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;
    background: rgba(255,255,255,0.75); color: var(--ink);
    outline: none;
  }
  input:focus-visible { box-shadow: 0 0 0 3px rgba(255,255,255,0.8); }

  .btn {
    width: 100%; margin-top: 14px; padding: 12px 14px; border: none; border-radius: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    background: var(--ink); color: #FFE9B8; cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: rgba(255,255,255,0.55); color: var(--ink); }

  .msg { font-size: 13px; font-weight: 700; margin-top: 10px; text-align: center; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }

  #gate-view { }
  #panel-view { display: none; }

  .current {
    text-align: center; margin-bottom: 18px;
  }
  .current .num {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 44px; color: #fff;
    text-shadow: 0 2px 0 rgba(120,70,10,0.35); line-height: 1;
  }
  .current .label { font-size: 12px; font-weight: 700; color: rgba(74,51,27,0.75); margin-top: 4px; }

  .keybox {
    margin-top: 18px; padding: 12px 14px; border-radius: 14px;
    background: rgba(255,255,255,0.45); font-size: 12px; line-height: 1.5;
    word-break: break-all;
  }
  .keybox strong { display:block; margin-bottom: 4px; }
  .keybox code {
    display: block; margin-top: 6px; padding: 8px 10px; border-radius: 10px;
    background: rgba(0,0,0,0.08); font-size: 12px;
  }

  .hr { height: 1px; background: rgba(74,51,27,0.15); margin: 20px 0; border: none; }

  .back-link {
    display:block; text-align:center; margin-top:18px; font-size: 13px;
    font-weight: 700; color: rgba(74,51,27,0.7); text-decoration: none;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card" id="card">

  <!-- 비밀번호 게이트 -->
  <div id="gate-view">
    <h1 class="title">🔒 관리자 전용</h1>
    <label class="field-label" for="pw">비밀번호</label>
    <input type="password" id="pw" autocomplete="off" />
    <button class="btn" id="enter-btn">입장</button>
    <p class="msg error" id="gate-msg" style="display:none;">비밀번호가 틀렸어요.</p>
  </div>

  <!-- 관리자 패널 -->
  <div id="panel-view">
    <h1 class="title">🦆 조회수 관리</h1>

    <div class="current">
      <div class="num" id="current-count">···</div>
      <div class="label">현재 조회수</div>
    </div>

    <label class="field-label" for="new-count">새 조회수로 설정</label>
    <input type="number" id="new-count" min="0" step="1" placeholder="예: 100" />
    <button class="btn" id="save-btn">저장하기</button>
    <p class="msg" id="panel-msg" style="display:none;"></p>

    <div id="key-warning" class="keybox" style="display:none;">
      <strong>⚠️ 관리자 키 백업 (최초 1회만 표시됨)</strong>
      이 브라우저에 자동 저장되긴 했지만, 브라우저 기록/캐시를 지우면 다시는 볼 수 없어요.
      메모장 같은 곳에 꼭 복사해두세요.
      <code id="admin-key-display"></code>
    </div>

    <hr class="hr" id="manual-key-divider" style="display:none;">
    <div id="manual-key-section" style="display:none;">
      <label class="field-label" for="manual-key">예전에 저장해둔 관리자 키 입력</label>
      <input type="text" id="manual-key" placeholder="admin key 붙여넣기" />
      <button class="btn secondary" id="use-manual-key-btn">이 키 사용하기</button>
    </div>

    <a class="back-link" href="index.html">← 프로필로 돌아가기</a>
  </div>

</div>

<script>
(function () {
  const PASSWORD = 'hodu0118';
  const NAMESPACE = 'hodu-lucky-duck';
  const KEY = 'views';
  const ADMIN_KEY_STORAGE = 'hodu_admin_key';
  const BASE = 'https://abacus.jasoncameron.dev';

  const gateView = document.getElementById('gate-view');
  const panelView = document.getElementById('panel-view');
  const pwInput = document.getElementById('pw');
  const enterBtn = document.getElementById('enter-btn');
  const gateMsg = document.getElementById('gate-msg');
  const card = document.getElementById('card');

  const currentCountEl = document.getElementById('current-count');
  const newCountInput = document.getElementById('new-count');
  const saveBtn = document.getElementById('save-btn');
  const panelMsg = document.getElementById('panel-msg');
  const keyWarning = document.getElementById('key-warning');
  const adminKeyDisplay = document.getElementById('admin-key-display');
  const manualDivider = document.getElementById('manual-key-divider');
  const manualSection = document.getElementById('manual-key-section');
  const manualKeyInput = document.getElementById('manual-key');
  const useManualKeyBtn = document.getElementById('use-manual-key-btn');

  function showPanelMsg(text, ok) {
    panelMsg.textContent = text;
    panelMsg.className = 'msg ' + (ok ? 'ok' : 'error');
    panelMsg.style.display = 'block';
  }

  function tryEnter() {
    if (pwInput.value === PASSWORD) {
      gateView.style.display = 'none';
      panelView.style.display = 'block';
      initPanel();
    } else {
      gateMsg.style.display = 'block';
      card.classList.remove('shake');
      void card.offsetWidth; // 리플로우 트리거로 애니메이션 재실행
      card.classList.add('shake');
      pwInput.value = '';
    }
  }

  enterBtn.addEventListener('click', tryEnter);
  pwInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });

  function getAdminKey() {
    return localStorage.getItem(ADMIN_KEY_STORAGE);
  }

  function refreshCurrentValue() {
    fetch(`${BASE}/get/${NAMESPACE}/${KEY}`)
      .then((res) => res.json())
      .then((data) => {
        currentCountEl.textContent = data.value;
      })
      .catch(() => {
        currentCountEl.textContent = '-';
      });
  }

  function initPanel() {
    const savedKey = getAdminKey();
    if (savedKey) {
      refreshCurrentValue();
      manualDivider.style.display = 'none';
      manualSection.style.display = 'none';
      return;
    }

    // 관리자 키가 없는 경우: 카운터가 이미 있는지 먼저 확인
    fetch(`${BASE}/get/${NAMESPACE}/${KEY}`)
      .then((res) => {
        if (res.status === 404) {
          // 아직 카운터가 없음 -> 새로 생성해서 관리자 키 발급
          return fetch(`${BASE}/create/${NAMESPACE}/${KEY}?initializer=0`)
            .then((r) => r.json())
            .then((data) => {
              if (data.admin_key) {
                localStorage.setItem(ADMIN_KEY_STORAGE, data.admin_key);
                adminKeyDisplay.textContent = data.admin_key;
                keyWarning.style.display = 'block';
              }
              currentCountEl.textContent = data.value;
            });
        } else {
          // 이미 존재하는데 이 브라우저엔 관리자 키가 없음
          return res.json().then((data) => {
            currentCountEl.textContent = data.value;
            manualDivider.style.display = 'block';
            manualSection.style.display = 'block';
            showPanelMsg('이 브라우저엔 관리자 키가 없어요. 저장해둔 키를 아래에 입력하세요.', false);
          });
        }
      })
      .catch(() => {
        currentCountEl.textContent = '-';
      });
  }

  useManualKeyBtn.addEventListener('click', () => {
    const val = manualKeyInput.value.trim();
    if (!val) return;
    localStorage.setItem(ADMIN_KEY_STORAGE, val);
    manualDivider.style.display = 'none';
    manualSection.style.display = 'none';
    showPanelMsg('키를 저장했어요. 이제 조회수를 설정할 수 있어요.', true);
    refreshCurrentValue();
  });

  saveBtn.addEventListener('click', () => {
    const val = parseInt(newCountInput.value, 10);
    if (isNaN(val) || val < 0) {
      showPanelMsg('숫자를 정확히 입력해주세요.', false);
      return;
    }
    const adminKey = getAdminKey();
    if (!adminKey) {
      showPanelMsg('관리자 키가 없어서 설정할 수 없어요. 위에 키를 먼저 입력하세요.', false);
      return;
    }
    fetch(`${BASE}/set/${NAMESPACE}/${KEY}?value=${val}`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${adminKey}` }
    })
      .then((res) => res.json())
      .then((data) => {
        if (data.value !== undefined) {
          currentCountEl.textContent = data.value;
          newCountInput.value = '';
          showPanelMsg('조회수를 저장했어요!', true);
        } else {
          showPanelMsg(data.error || '설정에 실패했어요.', false);
        }
      })
      .catch(() => {
        showPanelMsg('네트워크 오류로 실패했어요.', false);
      });
  });
})();
</script>

</body>
</html>
